<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b5451b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Nour Wehbi — Journalist &amp; Digital Media Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Nour Wehbi, a journalism and digital media student in Beirut working across reporting, photography, video and multimedia storytelling."
    />
    <meta name="author" content="Nour Wehbi" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the saved theme before first paint to avoid a flash of the
      // wrong palette. The React hook takes over from here.
      (function () {
        try {
          var saved = localStorage.getItem('nw-theme')
          var dark =
            saved === 'dark' ||
            (!saved &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
